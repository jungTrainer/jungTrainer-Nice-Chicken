name: Expansion Event Cleanup Steps

on:
  push:
    paths:
      - ".github/workflows/remove-expansion-inline-onclick-step2-3b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify split baseline
        run: |
          test -f index.html
          test -f js/main.js
          test "$(grep -c '<script src="./js/main.js"></script>' index.html || true)" = "1"
          node --check js/main.js

      - name: Apply Step 2-7 runtime stabilization
        run: |
          python3 scripts/apply-step2-7-stabilize-open-map-flow.py

      - name: Verify Step 2-7 stabilization
        run: |
          test "$(grep -R -c ' onclick=' index.html js/main.js | awk -F: '{s+=$2} END {print s+0}')" = "0"
          test "$(grep -c 'safeClick("openMap"' js/main.js || true)" = "0"
          test "$(grep -c 'openMapBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'function openExpansionModal()' js/main.js || true)" = "1"
          test "$(grep -c 'id="mapWrap"' index.html || true)" = "1"
          test "$(grep -c 'id="expansionList"' index.html || true)" = "0"
          test "$(grep -c 'mapGoBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'mapUnlockBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'closeExpansionModalBtn.addEventListener("click"' js/main.js || true)" = "1"
          node --check js/main.js

      - name: Commit Step 2-7 stabilization
        run: |
          if git diff --quiet -- js/main.js docs/2026-05-15-step2-7-runtime-stabilization.md; then
            echo "No Step 2-7 changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js docs/2026-05-15-step2-7-runtime-stabilization.md
          git commit -m "Stabilize expansion modal map flow"
          git push

