## 작업 범위

이번 단계에서는 지역 확장 모달 닫기 버튼의 inline 이벤트를 제거했다.

기존:

```html
<button class="closeBtn" onclick="closeExpansionModal()">✕</button>
```

변경:

```html
<button class="closeBtn" id="closeExpansionModalBtn" type="button">✕</button>
```

그리고 `initDOMRefs()` 흐름 안에서 DOM 참조 후 이벤트를 연결하도록 변경했다.

```js
const closeExpansionModalBtn = document.getElementById("closeExpansionModalBtn");
if(closeExpansionModalBtn){
  closeExpansionModalBtn.addEventListener("click", (e)=>{
    e.preventDefault();
    e.stopPropagation();
    if(typeof closeExpansionModal === "function") closeExpansionModal();
    else document.getElementById("modalExpansion")?.classList.remove("on");
  }, {passive:false});
}
```

## 검증 기준

- `onclick="closeExpansionModal()"` 제거
- `id="closeExpansionModalBtn"` 1개 존재
- close 버튼 이벤트 바인딩 1개 존재
- script 추출 후 `node --check` 문법 검사 통과

## 남은 작업

지역 확장 카드 내부의 `moveBranch`, `unlockBranch` 버튼은 별도 추적이 필요하다. 현재 확인된 명시적 inline 제거 대상은 모달 닫기 버튼이었다.

다음 단계에서는 `renderExpansion` 또는 지역 카드 생성 로직을 더 정확히 찾아 `data-action` 기반 이벤트 위임으로 정리한다.
''', encoding='utf-8')

