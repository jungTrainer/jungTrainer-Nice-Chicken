name: Remove Expansion Inline Onclick Step 2-3B

on:
  push:
    paths:
      - ".github/workflows/remove-expansion-inline-onclick-step2-3b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-onclick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run committed safe apply script
        run: |
          python3 scripts/apply-step2-3b-close-expansion-onclick.py

      - name: Verify target counts
        run: |
          test "$(grep -c 'onclick="closeExpansionModal()"' index.html || true)" = "0"
          test "$(grep -c 'id="closeExpansionModalBtn"' index.html || true)" = "1"
          test "$(grep -c 'closeExpansionModalBtn.addEventListener("click"' index.html || true)" = "1"
          test "$(grep -c 'function closeExpansionModal(' index.html || true)" = "1"

      - name: Commit expansion onclick cleanup
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove expansion close inline onclick"
          git push

