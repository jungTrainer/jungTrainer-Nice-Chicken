name: Expansion Event Cleanup Steps

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Step 3-3 baseline
        run: |
          test -f index.html
          test -f js/main.js
          test -f js/core/audio.js
          test -f scripts/apply-step3-3-utils-split.py
          test "$(grep -c '<script src="./js/core/audio.js"></script>' index.html || true)" = "1"
          test "$(grep -c '<script src="./js/main.js"></script>' index.html || true)" = "1"
          test "$(grep -c '<script src="./js/core/utils.js"></script>' index.html || true)" = "0"
          test "$(grep -c 'function fmtWon' js/main.js || true)" = "1"
          test "$(grep -c 'function safeOn' js/main.js || true)" = "1"
          test "$(grep -c '\.onclick[[:space:]]*=' js/main.js || true)" = "0"
          test "$(grep -c 'function safeClick' js/main.js || true)" = "0"
          test "$(grep -c 'safeClick(' js/main.js || true)" = "0"
          test "$(grep -R -c ' onclick=' index.html js/main.js | awk -F: '{s+=$2} END {print s+0}')" = "0"
          node --check js/core/audio.js
          node --check js/main.js

      - name: Apply Step 3-3 utils split
        run: |
          python3 scripts/apply-step3-3-utils-split.py

      - name: Verify Step 3-3 utils split
        run: |
          test -f js/core/utils.js
          test -f docs/2026-05-15-step3-3-utils-split.md
          test "$(grep -c '<script src="./js/core/utils.js"></script>' index.html || true)" = "1"
          test "$(grep -c '<script src="./js/core/audio.js"></script>' index.html || true)" = "1"
          test "$(grep -c '<script src="./js/main.js"></script>' index.html || true)" = "1"
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.index('<script src="./js/core/utils.js"></script>') < html.index('<script src="./js/core/audio.js"></script>') < html.index('<script src="./js/main.js"></script>')
          PY
          for fn in fmtKoreanUnits fmtWon fmtNoWon fmtCompactWon fmtCompact clamp clampInt dayKey nowK isHangulOnly safeOn _bindSafe; do
            test "$(grep -c "function $fn" js/core/utils.js || true)" = "1"
            test "$(grep -c "function $fn" js/main.js || true)" = "0"
          done
          test "$(grep -c '\.onclick[[:space:]]*=' js/main.js || true)" = "0"
          test "$(grep -c 'function safeClick' js/main.js || true)" = "0"
          test "$(grep -c 'safeClick(' js/main.js || true)" = "0"
          test "$(grep -R -c ' onclick=' index.html js/main.js | awk -F: '{s+=$2} END {print s+0}')" = "0"
          node --check js/core/utils.js
          node --check js/core/audio.js
          node --check js/main.js

      - name: Commit Step 3-3 utils split
        run: |
          if git diff --quiet -- index.html js/main.js js/core/utils.js docs/2026-05-15-step3-3-utils-split.md; then
            echo "No Step 3-3 changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/main.js js/core/utils.js docs/2026-05-15-step3-3-utils-split.md
          git commit -m "Split utility helpers into core module"
          git push
