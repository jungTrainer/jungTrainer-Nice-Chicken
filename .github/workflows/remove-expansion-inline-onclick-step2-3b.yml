name: Expansion Event Cleanup Steps

on:
  push:
    paths:
      - ".github/workflows/remove-expansion-inline-onclick-step2-3b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Step 2-3B close button cleanup
        run: |
          python3 scripts/apply-step2-3b-close-expansion-onclick.py

      - name: Ensure Step 2-3C map event delegation
        run: |
          python3 scripts/apply-step2-3c-map-event-delegation.py

      - name: Ensure Step 2-3D map button events
        run: |
          python3 scripts/apply-step2-3d-map-buttons.py

      - name: Ensure Step 2-3E open map flow
        run: |
          python3 scripts/apply-step2-3e-open-map-flow.py

      - name: Ensure Step 2-5 main JS split
        run: |
          if [ ! -f js/main.js ]; then
            python3 scripts/prepare-step2-5-split-main-js.py
          else
            node --check js/main.js
          fi

      - name: Apply Step 2-6 expansion inline onclick cleanup
        run: |
          python3 scripts/apply-step2-6-remove-expansion-inline-onclick.py

      - name: Verify Step 2-6 cleanup
        run: |
          test -f js/main.js
          test "$(grep -R -c ' onclick=' index.html js/main.js | awk -F: '{s+=$2} END {print s+0}')" = "0"
          test "$(grep -c 'data-action="move-branch"' js/main.js || true)" -ge "1"
          test "$(grep -c 'data-action="unlock-branch"' js/main.js || true)" -ge "1"
          test "$(grep -c 'function moveBranch(id)' js/main.js || true)" = "1"
          test "$(grep -c 'function unlockBranch(id)' js/main.js || true)" = "1"
          test "$(grep -c 'openMapBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'mapGoBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'mapUnlockBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'closeExpansionModalBtn.addEventListener("click"' js/main.js || true)" = "1"
          node --check js/main.js

      - name: Commit Step 2-6 cleanup
        run: |
          if git diff --quiet -- js/main.js docs/2026-05-15-step2-6-expansion-inline-onclick-cleanup.md; then
            echo "No Step 2-6 changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js docs/2026-05-15-step2-6-expansion-inline-onclick-cleanup.md
          git commit -m "Remove expansion card inline onclick handlers"
          git push

