name: Expansion Event Cleanup Steps

on:
  push:
    paths:
      - ".github/workflows/remove-expansion-inline-onclick-step2-3b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Step 2-3B close button cleanup
        run: |
          python3 scripts/apply-step2-3b-close-expansion-onclick.py

      - name: Ensure Step 2-3C map event delegation
        run: |
          python3 scripts/apply-step2-3c-map-event-delegation.py

      - name: Ensure Step 2-3D map button events
        run: |
          python3 scripts/apply-step2-3d-map-buttons.py

      - name: Ensure Step 2-3E open map flow
        run: |
          python3 scripts/apply-step2-3e-open-map-flow.py

      - name: Run Step 2-4 JS readiness diagnostics
        run: |
          python3 scripts/diagnose-step2-4-js-readiness.py

      - name: Apply Step 2-5 main JS split
        run: |
          python3 scripts/prepare-step2-5-split-main-js.py

      - name: Verify Step 2-5 main JS split
        run: |
          test -f docs/2026-05-15-step2-4-js-readiness.md
          test -f docs/2026-05-15-step2-5-main-js-split.md
          test -f js/main.js
          test "$(grep -c '<script src="./js/main.js"></script>' index.html || true)" = "1"
          test "$(grep -c 'Splash auto-hide' index.html || true)" = "1"
          test "$(grep -c 'service worker disabled in this build' index.html || true)" = "1"
          test "$(grep -c './css/style.css' index.html || true)" = "1"
          test "$(grep -c 'openMapBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'mapGoBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'mapUnlockBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'closeExpansionModalBtn.addEventListener("click"' js/main.js || true)" = "1"
          node --check js/main.js

      - name: Commit Step 2-5 main JS split
        run: |
          if git diff --quiet -- index.html js/main.js docs/2026-05-15-step2-4-js-readiness.md docs/2026-05-15-step2-5-main-js-split.md; then
            echo "No Step 2-5 changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/main.js docs/2026-05-15-step2-4-js-readiness.md docs/2026-05-15-step2-5-main-js-split.md
          git commit -m "Split main JavaScript into js main file"
          git push

