name: Expansion Event Cleanup Steps

on:
  push:
    paths:
      - ".github/workflows/remove-expansion-inline-onclick-step2-3b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Step 2-3B close button cleanup
        run: |
          python3 scripts/apply-step2-3b-close-expansion-onclick.py

      - name: Ensure Step 2-3C map event delegation
        run: |
          python3 scripts/apply-step2-3c-map-event-delegation.py

      - name: Ensure Step 2-3D map button events
        run: |
          python3 scripts/apply-step2-3d-map-buttons.py

      - name: Ensure Step 2-3E open map flow
        run: |
          python3 scripts/apply-step2-3e-open-map-flow.py

      - name: Run Step 2-4 JS readiness diagnostics
        run: |
          python3 scripts/diagnose-step2-4-js-readiness.py

      - name: Verify Step 2-4 diagnostic report
        run: |
          test -f docs/2026-05-15-step2-4-js-readiness.md
          grep -q 'js/main.js 분리 판단' docs/2026-05-15-step2-4-js-readiness.md

      - name: Commit expansion cleanup and diagnostics
        run: |
          if git diff --quiet -- index.html docs/2026-05-15-step2-4-js-readiness.md; then
            echo "No Step 2-4 changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/2026-05-15-step2-4-js-readiness.md
          git commit -m "Add JS readiness diagnostics"
          git push

