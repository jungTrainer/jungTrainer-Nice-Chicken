name: Expansion Event Cleanup Steps

on:
  push:
    paths:
      - ".github/workflows/remove-expansion-inline-onclick-step2-3b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify split baseline
        run: |
          test -f index.html
          test -f js/main.js
          test "$(grep -c '<script src="./js/main.js"></script>' index.html || true)" = "1"
          node --check js/main.js

      - name: Apply Step 2-10 profile save click cleanup
        run: |
          python3 scripts/apply-step2-10-profile-save-clicks.py

      - name: Verify Step 2-10 cleanup
        run: |
          test "$(grep -R -c ' onclick=' index.html js/main.js | awk -F: '{s+=$2} END {print s+0}')" = "0"
          for target in \
            forceSaveBtn.onclick \
            resetAllBtn.onclick \
            toggleSoundBtn.onclick \
            saveNameBtn.onclick \
            claimOfflineBtn.onclick; do
            test "$(grep -c "$target" js/main.js || true)" = "0"
          done
          for target in \
            'forceSaveBtn.addEventListener("click"' \
            'resetAllBtn.addEventListener("click"' \
            'toggleSoundBtn.addEventListener("click"' \
            'saveNameBtn.addEventListener("click"' \
            'claimOfflineBtn.addEventListener("click"'; do
            test "$(grep -c "$target" js/main.js || true)" = "1"
          done
          for target in \
            'openMapBtn.addEventListener("click"' \
            'mapGoBtn.addEventListener("click"' \
            'mapUnlockBtn.addEventListener("click"' \
            'closeExpansionModalBtn.addEventListener("click"' \
            'closeSettingsBtn.addEventListener("click"' \
            'closeCouponsBtn.addEventListener("click"' \
            'closeExchangeBtn.addEventListener("click"' \
            'pinCancelBtn.addEventListener("click"' \
            'pinOkBtn.addEventListener("click"' \
            'openCouponsBtn.addEventListener("click"' \
            'openExchangeBtn.addEventListener("click"' \
            'clearLogBtn.addEventListener("click"' \
            'useDrinkCouponBtn.addEventListener("click"' \
            'useVegCouponBtn.addEventListener("click"' \
            'doExchangeBtn.addEventListener("click"' \
            'useCertDrinkBtn.addEventListener("click"' \
            'makeCardBtn.addEventListener("click"'; do
            test "$(grep -c "$target" js/main.js || true)" = "1"
          done
          node --check js/main.js

      - name: Commit Step 2-10 cleanup
        run: |
          if git diff --quiet -- js/main.js docs/2026-05-15-step2-10-profile-save-click-cleanup.md; then
            echo "No Step 2-10 changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js docs/2026-05-15-step2-10-profile-save-click-cleanup.md
          git commit -m "Convert profile save clicks to event listeners"
          git push

