name: Expansion Event Cleanup Steps

on:
  push:
    paths:
      - ".github/workflows/remove-expansion-inline-onclick-step2-3b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify split baseline
        run: |
          test -f index.html
          test -f js/main.js
          test "$(grep -c '<script src="./js/main.js"></script>' index.html || true)" = "1"
          node --check js/main.js

      - name: Apply Step 2-8 modal pin click cleanup
        run: |
          python3 scripts/apply-step2-8-modal-pin-clicks.py

      - name: Verify Step 2-8 cleanup
        run: |
          test "$(grep -R -c ' onclick=' index.html js/main.js | awk -F: '{s+=$2} END {print s+0}')" = "0"
          test "$(grep -c 'closeSettingsBtn.onclick' js/main.js || true)" = "0"
          test "$(grep -c 'closeCouponsBtn.onclick' js/main.js || true)" = "0"
          test "$(grep -c 'closeExchangeBtn.onclick' js/main.js || true)" = "0"
          test "$(grep -c 'pinCancelBtn.onclick' js/main.js || true)" = "0"
          test "$(grep -c 'pinOkBtn.onclick' js/main.js || true)" = "0"
          test "$(grep -c 'closeSettingsBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'closeCouponsBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'closeExchangeBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'pinCancelBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'pinOkBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'openMapBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'mapGoBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'mapUnlockBtn.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'closeExpansionModalBtn.addEventListener("click"' js/main.js || true)" = "1"
          node --check js/main.js

      - name: Commit Step 2-8 cleanup
        run: |
          if git diff --quiet -- js/main.js docs/2026-05-15-step2-8-modal-pin-click-cleanup.md; then
            echo "No Step 2-8 changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js docs/2026-05-15-step2-8-modal-pin-click-cleanup.md
          git commit -m "Convert modal pin clicks to event listeners"
          git push

