name: Expansion Event Cleanup Steps

on:
  push:
    paths:
      - ".github/workflows/remove-expansion-inline-onclick-step2-3b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Step 2-3B close button cleanup
        run: |
          python3 scripts/apply-step2-3b-close-expansion-onclick.py

      - name: Ensure Step 2-3C map event delegation
        run: |
          python3 scripts/apply-step2-3c-map-event-delegation.py

      - name: Apply Step 2-3D map button events
        run: |
          python3 scripts/apply-step2-3d-map-buttons.py

      - name: Verify Step 2-3D counts
        run: |
          test "$(grep -c 'id="mapGo"' index.html || true)" = "1"
          test "$(grep -c 'id="mapUnlock"' index.html || true)" = "1"
          test "$(grep -c 'mapGoBtn.addEventListener("click"' index.html || true)" = "1"
          test "$(grep -c 'mapUnlockBtn.addEventListener("click"' index.html || true)" = "1"
          test "$(grep -c 'mapWrapEl.addEventListener("click"' index.html || true)" = "1"

      - name: Commit expansion event cleanup
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add map movement and unlock button events"
          git push

