name: Expansion Event Cleanup Steps

on:
  push:
    paths:
      - ".github/workflows/remove-expansion-inline-onclick-step2-3b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-expansion-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify split baseline
        run: |
          test -f index.html
          test -f js/main.js
          test "$(grep -c '<script src="./js/main.js"></script>' index.html || true)" = "1"
          node --check js/main.js

      - name: Apply Step 2-17 upgList click cleanup
        run: |
          python3 scripts/apply-step2-17-upglist-click-cleanup.py

      - name: Verify Step 2-17 upgList click cleanup
        run: |
          test -f docs/2026-05-15-step2-17-upglist-click-cleanup.md
          test "$(grep -c 'div.querySelector("button").onclick' js/main.js || true)" = "0"
          test "$(grep -c 'card.querySelector(`#btn-auto-${s.key}`).onclick' js/main.js || true)" = "0"
          test "$(grep -c 'card.querySelector(`#btn-tip-${s.key}`).onclick' js/main.js || true)" = "0"
          test "$(grep -c 'dataset.action = "buy-upgrade"' js/main.js || true)" = "1"
          test "$(grep -c 'dataset.action = "buy-staff-upgrade"' js/main.js || true)" = "2"
          test "$(grep -c 'upgListEl.addEventListener("click"' js/main.js || true)" = "1"
          test "$(grep -c 'function safeClick' js/main.js || true)" = "0"
          test "$(grep -c 'safeClick(' js/main.js || true)" = "0"
          test "$(grep -R -c ' onclick=' index.html js/main.js | awk -F: '{s+=$2} END {print s+0}')" = "0"
          node --check js/main.js

      - name: Commit Step 2-17 upgList click cleanup
        run: |
          if git diff --quiet -- js/main.js docs/2026-05-15-step2-17-upglist-click-cleanup.md; then
            echo "No Step 2-17 changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js docs/2026-05-15-step2-17-upglist-click-cleanup.md
          git commit -m "Convert upgList click handlers"
          git push

