name: Game CI

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select push or PR checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: select
        with:
          script: |
            let run = true;
            if (context.eventName === 'push') {
              const branch = context.ref.replace(/^refs\/heads\//, '');
              if (branch !== context.payload.repository.default_branch) {
                const { data: prs } = await github.rest.pulls.list({
                  ...context.repo, state: 'open',
                  head: `${context.repo.owner}:${branch}`, per_page: 1
                });
                run = prs.length === 0;
              }
            }
            core.setOutput('run', String(run));
            core.info(run ? 'Run checks for this event.' : 'Open PR owns the checks; skip duplicate push tests.');

  checks:
    name: Syntax and browser regression
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install, diagnose and verify
        run: bash scripts/ci-checks.sh
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
